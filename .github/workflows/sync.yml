name: sync

on:
  schedule:
    - cron: "0 11-23 * * *"
    - cron: "0 0-3 * * *"
  workflow_dispatch:
    inputs:
      relatorio:
        description: "Mandar o painel junto"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1


      - name: Painel só quando pedido
        id: quando
        run: |
          if [ "${{ github.event.inputs.relatorio }}" = "true" ]; then
            echo "relatorio=1" >> "$GITHUB_OUTPUT"
          else
            echo "relatorio=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Rodar o sync
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RELATORIO: ${{ steps.quando.outputs.relatorio }}
        run: python3 -u src/sync.py

      - name: Commitar o que mudou
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "financas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nada mudou"
            exit 0
          fi
          git commit -m "sync $(TZ=America/Campo_Grande date '+%d/%m %H:%M')"

          git config merge.ours.driver true
          printf '%s\n' \
            'painel.html merge=ours' \
            'state.json  merge=ours' > .git/info/attributes

          git config merge.renames false
          git config diff.renames false

          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true

            if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              echo "conflito que eu não sei resolver com segurança:"
              git diff --name-only --diff-filter=U
              sleep $((i * 5))
              continue
            fi

            PYTHONPATH=src python3 -c 'import painel; painel.gerar()' || true
            if ! git diff --quiet -- painel.html; then
              git add painel.html
              git commit -q --amend --no-edit
            fi

            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done

          git rebase --abort 2>/dev/null || true
          AVISO="🔴 <b>Não consegui salvar no GitHub.</b>%0A"
          AVISO="${AVISO}O que você mandou agora pode não ter sido gravado — confere o painel e manda de novo se faltar.%0A"
          AVISO="${AVISO}<i>Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}</i>"
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "text=${AVISO}" >/dev/null || true
          exit 1
