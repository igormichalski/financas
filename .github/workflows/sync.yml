name: sync

on:
  # REDE DE SEGURANÇA, não a fonte principal: o agendador do GitHub é "melhor
  # esforço" em repositório gratuito e já pulou 4 slots seguidos. Quem dispara de
  # verdade é um pinger externo de 15 em 15 min (veja o README).
  # Runner é UTC; Dourados/MS é UTC-4. De hora em hora, cobrindo 07h–00h daqui.
  schedule:
    - cron: "0 11-23 * * *"
    - cron: "0 0-3 * * *"
  workflow_dispatch:
    inputs:
      relatorio:
        description: "Mandar o painel junto"
        type: boolean
        default: false

permissions:
  contents: write

# Dois runs nunca podem escrever no CSV ao mesmo tempo.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # O run faz uma passada e morre (CICLO_RAPIDO=0). 10 min é folga pra uma rajada de
    # áudios com retentativa do Gemini, não orçamento de trabalho.
    timeout-minutes: 10
    steps:
      # Sem histórico: o repositório tem centenas de commits de sync e nada aqui olha
      # pro passado. Corta alguns segundos do checkout, que é caminho crítico agora.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Nada de actions/setup-python: o runner ubuntu-24.04 já vem com Python 3.12, e
      # baixar/instalar outro custava ~6-10s em TODO run. O código não usa dependência
      # externa nenhuma — só a stdlib.

      # Não existe mais relatório por horário: o bot só fala quando o custo muda
      # ou quando tem lembrete. O painel completo sai só se for pedido.
      - name: Painel só quando pedido
        id: quando
        run: |
          if [ "${{ github.event.inputs.relatorio }}" = "true" ]; then
            echo "relatorio=1" >> "$GITHUB_OUTPUT"
          else
            echo "relatorio=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Rodar o sync
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RELATORIO: ${{ steps.quando.outputs.relatorio }}
        # -u: sem buffer. Com buffer, todo o print do run saía de uma vez no fim, o que
        # fazia o log parecer que tudo aconteceu no último segundo e escondia onde o
        # tempo estava indo.
        run: python3 -u sync.py

      # always(): mesmo com o sync falhando, a fila e o offset precisam persistir —
      # senão o que já foi baixado do Telegram se perde.
      - name: Commitar o que mudou
        if: always()
        env:
          # Precisa aqui também: é este passo que avisa quando o push não vai.
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "financas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          # Sem mudança, sem commit: senão vira lixo de 34 commits vazios por dia.
          if git diff --cached --quiet; then
            echo "nada mudou"
            exit 0
          fi
          git commit -m "sync $(TZ=America/Campo_Grande date '+%d/%m %H:%M')"

          # painel.html e state.json são DERIVADOS e mudam em todo run, então são eles
          # que fazem o rebase empacar. Resolver por "ours" evita o conflito; o que
          # importa de verdade (lancamentos.csv) continua sendo mesclado normalmente.
          # Sem isso, o trabalho do run inteiro ia pro lixo — aconteceu em 04/08.
          # Cuidado: durante um REBASE, "ours" é o lado de cima (o que já está no
          # origin), não o nosso. Por isso o painel é refeito logo depois.
          git config merge.ours.driver true
          printf '%s\n' \
            'painel.html merge=ours' \
            'state.json  merge=ours' > .git/info/attributes

          # Os arquivos da inbox são JSONs pequenos e parecidos, então o git detecta
          # "rename" onde não existe: apagar inbox/806 e o Worker criar inbox/807 virava
          #   CONFLICT (rename/delete): 806 renamed to 807 in HEAD, but deleted in <nosso>
          # e o run inteiro morria (05/08 13:00). Sem detecção de rename, as duas coisas
          # são o que realmente são — caminhos diferentes — e mesclam sem conflito.
          # Não custa nada: nada neste repositório é renomeado de verdade.
          git config merge.renames false
          git config diff.renames false

          # O push pode colidir com outro run; rebase e tenta de novo.
          for i in 1 2 3; do
            # Rebase que falha deixa o repositório em estado conflitado, e aí as
            # tentativas seguintes morrem com "you have unmerged files" sem nem tentar.
            # Limpar antes é o que torna a retentativa útil.
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true

            if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              # De propósito NÃO existe resolução automática aqui.
              #
              # A tentativa óbvia — "conflito na inbox? honra a remoção, a mensagem já
              # está na fila.json" — foi testada e PERDE MENSAGEM. Com rename fantasma o
              # git atribui a remoção do 806 ao caminho do 807, então honrar a remoção
              # apaga um 807 que este run nunca leu. Falhar alto (o aviso no Telegram
              # abaixo) é melhor que apagar calado o que você acabou de mandar.
              echo "conflito que eu não sei resolver com segurança:"
              git diff --name-only --diff-filter=U
              sleep $((i * 5))
              continue
            fi

            # Já com o ledger mesclado, refaz o painel: ele é 100% derivado, e a
            # resolução por "ours" acima pode ter deixado a versão antiga no lugar.
            python3 -c 'import painel; painel.gerar()' || true
            if ! git diff --quiet -- painel.html; then
              git add painel.html
              git commit -q --amend --no-edit
            fi

            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done

          # Chegou aqui, o trabalho deste run vai ser descartado quando o runner morrer.
          # Falhar calado é o pior caso: você acha que lançou e não lançou.
          git rebase --abort 2>/dev/null || true
          AVISO="🔴 <b>Não consegui salvar no GitHub.</b>%0A"
          AVISO="${AVISO}O que você mandou agora pode não ter sido gravado — confere o painel e manda de novo se faltar.%0A"
          AVISO="${AVISO}<i>Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}</i>"
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "text=${AVISO}" >/dev/null || true
          exit 1
